<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- 这行是手机适配的关键：让页面宽度等于设备宽度，初始缩放1倍 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>床头粤语</title>
    <style>
        /* 使用更柔和的字体和基础样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1e1e2f;  /* 深蓝紫色，更助眠 */
            color: #f0e6d0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            text-align: center;
            line-height: 1.5;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 32px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 {
            font-size: 2rem;        /* 相对单位，手机上看足够大 */
            font-weight: 400;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #ffd9b0;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 24px;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            padding-bottom: 16px;
        }
        audio {
            width: 100%;
            height: 54px;            /* 稍微大一点，方便点击 */
            border-radius: 27px;
            outline: none;
            background: #2d2d44;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        /* 针对不支持 audio 控制的浏览器做提示 */
        .fallback {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌙 床头 · 粤语</h2>
        <p>夜深了，听我讲...</p>
        <audio controls autoplay playsinline>
            <!-- 确保文件名和上传的一致 -->
            <source src="bed-cantonese.mp3" type="audio/mpeg">
            你的浏览器不支持音频播放，请升级或换用其他浏览器。
        </audio>
        <div class="fallback">
            如果没自动播放，点一下播放键就好。
        </div>
    </div>
</body>
</html>
